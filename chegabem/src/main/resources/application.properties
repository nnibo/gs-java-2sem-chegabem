spring.application.name=chega-bem

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.expiration-days=7
jwt.key=${JWT_KEY}

chegabem.trajeto.tolerancia-minutos=10
chegabem.trajeto.intervalo-verificacao-ms=60000

chegabem.seed.habilitado=true
chegabem.seed.admin-email=${ADMIN_EMAIL}
chegabem.seed.admin-senha=${ADMIN_PASSWORD}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.persistAuthorization=true

server.port=${PORT:8080}
