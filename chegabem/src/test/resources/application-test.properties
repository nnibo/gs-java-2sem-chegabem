spring.datasource.url=jdbc:h2:mem:chegabem;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.expiration-days=1
jwt.key=chave-de-teste-apenas-nao-usar-em-producao

chegabem.trajeto.tolerancia-minutos=10
chegabem.trajeto.intervalo-verificacao-ms=3600000

chegabem.seed.habilitado=true
chegabem.seed.admin-email=admin@teste.local
chegabem.seed.admin-senha=AdminTeste@2026
