services:
  - type: web
    name: chegabem-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./chegabem/Dockerfile
    dockerContext: ./chegabem
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
